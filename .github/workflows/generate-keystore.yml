name: Generate Keystore (run once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore irancamp-release.jks \
            -alias irancamp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Irancamp@2026Secure \
            -keypass Irancamp@2026Secure \
            -dname "CN=IranCamp, OU=IranCamp, O=IranCamp, L=Tehran, S=Tehran, C=IR"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: irancamp-release-keystore
          path: irancamp-release.jks
